<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A tiny compute graph: two tensors flow along edges and fuse into one op. -->
  <rect width="32" height="32" rx="7" fill="#24489c"/>
  <g stroke="#f6f3ec" stroke-opacity=".45" stroke-width="1.6" stroke-linecap="round">
    <path d="M9 9 L16 23"/><path d="M23 9 L16 23"/>
  </g>
  <circle cx="9" cy="9" r="3.4" fill="#f6f3ec"/>
  <circle cx="23" cy="9" r="3.4" fill="#f6f3ec"/>
  <circle cx="9" r="1.6" fill="#ffcf5a"><animate attributeName="cy" values="9;23" dur="2.4s" keyTimes="0;1" keySplines=".5 0 .5 1" calcMode="spline" repeatCount="indefinite"/><animate attributeName="cx" values="9;16" dur="2.4s" keySplines=".5 0 .5 1" calcMode="spline" keyTimes="0;1" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.55;.6" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="23" r="1.6" fill="#ffcf5a"><animate attributeName="cy" values="9;23" dur="2.4s" keyTimes="0;1" keySplines=".5 0 .5 1" calcMode="spline" repeatCount="indefinite"/><animate attributeName="cx" values="23;16" dur="2.4s" keySplines=".5 0 .5 1" calcMode="spline" keyTimes="0;1" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.55;.6" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="16" cy="23" r="4" fill="none" stroke="#ffcf5a" stroke-width="1.4"><animate attributeName="r" values="4;4;9" keyTimes="0;.6;1" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.58;.62;1" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="16" cy="23" r="4" fill="#f6f3ec"><animate attributeName="r" values="4;4;5.2;4" keyTimes="0;.58;.66;1" dur="2.4s" repeatCount="indefinite"/><animate attributeName="fill" values="#f6f3ec;#f6f3ec;#ffcf5a;#f6f3ec" keyTimes="0;.58;.64;1" dur="2.4s" repeatCount="indefinite"/></circle>
</svg>
