<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A Feynman diagram: two electrons exchange a virtual photon (wavy line). -->
  <rect width="32" height="32" rx="7" fill="#24489c"/>
  <g stroke="#f6f3ec" stroke-width="1.8" stroke-linecap="round" fill="none">
    <path d="M5 5 L11 16 L5 27"/><path d="M27 5 L21 16 L27 27"/>
  </g>
  <path d="M11 16 q1.5 -3 3 0 t3 0 t3 0" transform="translate(-0.5 0)" stroke="#ffcf5a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-dasharray="3 1.5"><animate attributeName="stroke-dashoffset" values="0;-9" dur="1s" repeatCount="indefinite"/></path>
  <circle r="1.6" fill="#ffcf5a"><animateMotion path="M5 5 L11 16 L5 27" dur="2s" repeatCount="indefinite"/></circle>
  <circle r="1.6" fill="#ffcf5a"><animateMotion path="M27 5 L21 16 L27 27" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="11" cy="16" r="1.6" fill="#f6f3ec"/><circle cx="21" cy="16" r="1.6" fill="#f6f3ec"/>
</svg>
